<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memorization Practice</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Fraunces:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf4ea;--card:#fffdf8;--ink:#2b1a1a;--mute:#7a6560;--red:#6b1220;--red2:#9b1b30;--gold:#b88a3e;--line:#ead9c0;--sh:0 6px 22px rgba(107,18,32,.10)}
:root[data-t=dark]{--bg:#1a1012;--card:#26171a;--ink:#f3e8dc;--mute:#b9a49b;--red:#c4384d;--red2:#d9546a;--line:#42292d;--sh:0 6px 22px rgba(0,0,0,.4)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font:600 28px Fraunces,Georgia,serif;color:var(--red);margin:6px 0}
.top{display:flex;justify-content:space-between;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);padding:18px;margin:14px 0;border-top:3px solid var(--gold)}
label{display:block;font-weight:600;margin:12px 0 6px}
select,button{font:inherit;border-radius:12px;border:1px solid var(--line);padding:11px 12px;background:var(--card);color:var(--ink);width:100%}
button{cursor:pointer;transition:.2s;width:auto}button:active{transform:scale(.97)}
.pri{background:var(--red);color:#fff;border:0;font-weight:600;width:100%;padding:14px;margin-top:16px}
.pri:hover{background:var(--red2)}.ghost{background:none}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{flex:1;padding:10px 6px}.seg .on{background:var(--red);color:#fff;border-color:var(--red)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}
.ayah{font:400 clamp(30px,8vw,44px)/2.2 "Amiri Quran","Scheherazade New","Traditional Arabic",serif;direction:rtl;text-align:center;margin:8px 0}
.ref{text-align:center;color:var(--mute);font-size:14px}.ref b{color:var(--red);font-size:17px}
.hid{display:none}.err{color:#b3261e;background:#fdecea;border-radius:12px;padding:10px;margin:10px 0}
.load{text-align:center;color:var(--mute);padding:14px}
input[type=range]{width:100%;accent-color:var(--red)}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:8px}.leg i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px}
.h{color:#999}.s{color:#999}.l{color:#999}.n{color:#c0392b}.p{color:#e67e22}.m{color:#b9170c}.o{color:#b9170c}.q{color:#2471a3}.f{color:#d35400}.c{color:#d35400}.w{color:#1e8449}.i{color:#8e44ad}.a{color:#1e8449}.u{color:#16a085}.d{color:#7f8c8d}.b{color:#7f8c8d}.g{color:#d4ac0d}
.cont .ayah{font-size:clamp(24px,6vw,34px)}.small{font-size:13px;color:var(--mute)}
ul{padding-left:18px;margin:6px 0}
:fullscreen{overflow:auto;background:var(--bg)}
</style></head><body><main>
<div class="top"><h1>Memorization Practice</h1><div class="row" style="flex:none"><button class="ghost" id="dm" title="Dark mode">◐</button></div></div>

<section id="p1">
 <p class="small">See one ayah. Recite what comes next from memory.</p>
 <div class="card">
  <label>Practice by</label>
  <div class="seg" id="mode"><button data-v="juz" class="on">Juz</button><button data-v="surah">Surah range</button></div>
  <div id="juzBox"><label for="juz">Juz</label><select id="juz"></select></div>
  <div id="surBox" class="hid"><div class="row"><div><label for="from">From Surah</label><select id="from"></select></div><div><label for="to">To Surah</label><select id="to"></select></div></div></div>
  <label>Difficulty</label>
  <div class="seg" id="diff"><button data-v="easy">Easy</button><button data-v="moderate" class="on">Moderate</button><button data-v="hard">Hard</button><button data-v="mix">Mix</button></div>
  <div id="e1"></div>
  <button class="pri" id="gen">Generate random ayah</button>
 </div>
 <div class="card"><b>Recent</b><div id="hist" class="small">Nothing practiced yet.</div></div>
</section>

<section id="p2" class="hid">
 <div class="row"><button class="ghost" id="back">← Back</button><button class="ghost" id="fs">Full screen</button></div>
 <div class="card">
  <div id="e2"></div><div id="ld" class="load hid">Loading ayah…</div>
  <div id="view" class="hid">
   <div class="ref"><b id="rn"></b><div id="rm"></div></div>
   <div class="ayah" id="ar"></div>
   <div class="row"><button id="fav">☆ Favorite</button><button class="ghost" id="lg">Tajweed colors</button></div>
   <div class="leg hid" id="legend"></div>
  </div>
 </div>
 <div class="card hid" id="aud">
  <label for="rec" style="margin-top:0">Reciter</label><select id="rec"></select>
  <audio id="au" preload="none"></audio>
  <div class="row" style="margin-top:10px"><button id="pp">Play</button><button id="rp">Replay</button><span id="tm" style="flex:none">0:00 / 0:00</span></div>
  <input type="range" id="sk" min="0" max="100" value="0" aria-label="Progress">
  <div id="ae"></div>
 </div>
 <div class="card hid" id="act">
  <button class="pri" style="margin-top:0" id="rev">Reveal continuation</button>
  <div id="cont" class="cont hid"></div>
  <label>How did it go?</label>
  <div class="seg" id="mk"><button data-v="Knew it">I knew it</button><button data-v="Struggled">I struggled</button><button data-v="Review">Need review</button></div>
  <button class="pri" id="again">Another random ayah</button>
 </div>
</section>
</main>
<script>
const API='https://api.alquran.cloud/v1/',$=s=>document.querySelector(s);
const REC={'Yasser Al-Dosari':'Yasser_Ad-Dussary_128kbps|Dussary_128kbps','Mishary Alafasy':'Alafasy_128kbps','Abdul Rahman Al-Sudais':'Abdurrahmaan_As-Sudais_192kbps','Abdul Basit (Murattal)':'Abdul_Basit_Murattal_192kbps','Al-Husary':'Husary_128kbps','Maher Al-Muaiqly':'MaherAlMuaiqly128kbps'};
const TJ={n:'Madd (natural)',p:'Madd (permissible)',m:'Madd (obligatory)',q:'Qalqalah',f:'Ikhfa',c:'Ikhfa shafawi',w:'Idgham shafawi',a:'Idgham with ghunnah',u:'Idgham without ghunnah',i:'Iqlab',g:'Ghunnah',d:'Idgham mutajanisayn',b:'Idgham mutaqaribayn',h:'Silent / hamzat wasl',s:'Silent',l:'Lam shamsiyya'};
const TJC={n:'#c0392b',p:'#e67e22',m:'#b9170c',q:'#2471a3',f:'#d35400',c:'#d35400',w:'#1e8449',a:'#1e8449',u:'#16a085',i:'#8e44ad',g:'#d4ac0d',d:'#7f8c8d',b:'#7f8c8d',h:'#999',s:'#999',l:'#999'};
const S={mode:'juz',diff:'moderate',meta:null,cur:null};
const NM=['Al-Faatiha', 'Al-Baqara', 'Aal-i-Imraan', 'An-Nisaa', 'Al-Maaida', "Al-An'aam", "Al-A'raaf", 'Al-Anfaal', 'At-Tawba', 'Yunus', 'Hud', 'Yusuf', "Ar-Ra'd", 'Ibrahim', 'Al-Hijr', 'An-Nahl', 'Al-Israa', 'Al-Kahf', 'Maryam', 'Taa-Haa', 'Al-Anbiyaa', 'Al-Hajj', 'Al-Muminoon', 'An-Noor', 'Al-Furqaan', "Ash-Shu'araa", 'An-Naml', 'Al-Qasas', 'Al-Ankaboot', 'Ar-Room', 'Luqman', 'As-Sajda', 'Al-Ahzaab', 'Saba', 'Faatir', 'Yaseen', 'As-Saaffaat', 'Saad', 'Az-Zumar', 'Ghafir', 'Fussilat', 'Ash-Shura', 'Az-Zukhruf', 'Ad-Dukhaan', 'Al-Jaathiya', 'Al-Ahqaf', 'Muhammad', 'Al-Fath', 'Al-Hujuraat', 'Qaaf', 'Adh-Dhaariyat', 'At-Tur', 'An-Najm', 'Al-Qamar', 'Ar-Rahmaan', 'Al-Waaqia', 'Al-Hadid', 'Al-Mujaadila', 'Al-Hashr', 'Al-Mumtahana', 'As-Saff', "Al-Jumu'a", 'Al-Munaafiqoon', 'At-Taghaabun', 'At-Talaaq', 'At-Tahrim', 'Al-Mulk', 'Al-Qalam', 'Al-Haaqqa', "Al-Ma'aarij", 'Nooh', 'Al-Jinn', 'Al-Muzzammil', 'Al-Muddaththir', 'Al-Qiyaama', 'Al-Insaan', 'Al-Mursalaat', 'An-Naba', "An-Naazi'aat", 'Abasa', 'At-Takwir', 'Al-Infitaar', 'Al-Mutaffifin', 'Al-Inshiqaaq', 'Al-Burooj', 'At-Taariq', "Al-A'laa", 'Al-Ghaashiya', 'Al-Fajr', 'Al-Balad', 'Ash-Shams', 'Al-Lail', 'Ad-Dhuhaa', 'Ash-Sharh', 'At-Tin', 'Al-Alaq', 'Al-Qadr', 'Al-Bayyina', 'Az-Zalzala', 'Al-Aadiyaat', "Al-Qaari'a", 'At-Takaathur', 'Al-Asr', 'Al-Humaza', 'Al-Fil', 'Quraish', "Al-Maa'un", 'Al-Kawthar', 'Al-Kaafiroon', 'An-Nasr', 'Al-Masad', 'Al-Ikhlaas', 'Al-Falaq', 'An-Naas'],CT=[7, 286, 200, 176, 120, 165, 206, 75, 129, 109, 123, 111, 43, 52, 99, 128, 111, 110, 98, 135, 112, 78, 118, 64, 77, 227, 93, 88, 69, 60, 34, 30, 73, 54, 45, 83, 182, 88, 75, 85, 54, 53, 89, 59, 37, 35, 38, 29, 18, 45, 60, 49, 62, 55, 78, 96, 29, 22, 24, 13, 14, 11, 11, 18, 12, 12, 30, 52, 52, 44, 28, 28, 20, 56, 40, 31, 50, 40, 46, 42, 29, 19, 36, 25, 22, 17, 19, 26, 30, 20, 15, 21, 11, 8, 8, 19, 5, 8, 8, 11, 11, 8, 3, 9, 5, 4, 7, 3, 6, 3, 5, 4, 5, 6],JS=[1, 2, 2, 3, 4, 4, 5, 6, 7, 8, 9, 11, 12, 15, 17, 18, 21, 23, 25, 27, 29, 33, 36, 39, 41, 46, 51, 58, 67, 78];
S.meta={s:NM.map((name,i)=>({n:i+1,name,c:CT[i]})),j:JS.map(x=>({s:x}))};
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function jget(u){for(let t=0;t<3;t++){try{const r=await fetch(API+u);if(!r.ok)throw 0;const j=await r.json();if(j.code===200)return j.data}catch{}await sleep(500*(t+1))}throw new Error('Network request failed')}
const plain=t=>t.replace(/\[[a-z](?::\d+)?\[([^\]]*)\]/g,'$1');
const words=t=>plain(t).trim().split(/\s+/).length;
function toHTML(t){return t.replace(/\[([a-z])(?::\d+)?\[([^\]]*)\]/g,(_,c,x)=>`<span class="${c}" title="${TJ[c]||''}">${x}</span>`)}
// Load surah (cached): uthmani + tajweed
async function surah(n){
 const k='sur'+n;let c=ls.get(k);if(c)return c;
 const d=await jget(`surah/${n}/editions/quran-uthmani,quran-tajweed`);
 const [u,t]=d;c=u.ayahs.map((a,i)=>{let tx=a.text,tj=t.ayahs[i].text;
  if(a.numberInSurah===1&&n!==1&&n!==9){tx=tx.split(' ').slice(4).join(' ');tj=tj.split(' ').slice(4).join(' ')}
  return{g:a.number,i:a.numberInSurah,j:a.juz,u:tx,t:tj}});
 ls.set(k,c);return c}
async function loadMeta(){
 let m=ls.get('meta2');if(!m){const d=await jget('meta');m={s:d.surahs.references.map(x=>({n:x.number,name:x.englishName,ar:x.name,c:x.numberOfAyahs})),j:d.juzs.references.map(x=>({s:x.surah,a:x.ayah}))};
  if(m.s.length!==114||m.j.length!==30)throw new Error('Incomplete metadata');ls.set('meta2',m)}
 S.meta=m}
function fillSelects(){const m=S.meta,o=m.s.map(s=>`<option value="${s.n}">${s.n}. ${s.name}</option>`).join('');
 $('#from').innerHTML=o;$('#to').innerHTML=o;$('#to').value=114;
 $('#juz').innerHTML=Array.from({length:30},(_,i)=>`<option value="${i+1}">Juz ${i+1}</option>`).join('')}
function juzSurahs(j){const m=S.meta,a=m.j[j-1].s,b=j<30?m.j[j].s:114;return Array.from({length:b-a+1},(_,i)=>a+i)}
const bucket=w=>w<=10?'easy':w<=20?'moderate':'hard';
function validate(){if(S.mode==='surah'&&+$('#from').value>+$('#to').value){$('#e1').innerHTML='<div class="err">“From” surah must come before or equal “To”.</div>';return false}$('#e1').innerHTML='';return true}
async function pick(){
 let list=S.mode==='juz'?juzSurahs(+$('#juz').value):Array.from({length:+$('#to').value-+$('#from').value+1},(_,i)=>+$('#from').value+i);
 const want=S.diff==='mix'?['easy','moderate','hard'][Math.random()*3|0]:S.diff;
 const order=[want,...['moderate','easy','hard'].filter(x=>x!==want)];
 const pool=list.slice();
 // weight by ayah count, try surahs in random order
 const tried=[];while(pool.length){let tot=pool.reduce((a,n)=>a+S.meta.s[n-1].c,0),r=Math.random()*tot,idx=0;for(;idx<pool.length;idx++){r-=S.meta.s[pool[idx]-1].c;if(r<=0)break}
  const n=pool.splice(Math.min(idx,pool.length-1),1)[0],ay=await surah(n);tried.push([n,ay]);
  const ok=ay.filter(a=>(S.mode==='surah'||a.j===+$('#juz').value)&&a.i<ay.length&&bucket(words(a.u))===want);
  if(ok.length)return{n,ay,a:ok[Math.random()*ok.length|0],level:want}}
 // fallback: nearest difficulty among loaded surahs
 for(const lv of order.slice(1))for(const[n,ay]of tried){const ok=ay.filter(a=>(S.mode==='surah'||a.j===+$('#juz').value)&&a.i<ay.length&&bucket(words(a.u))===lv);if(ok.length)return{n,ay,a:ok[Math.random()*ok.length|0],level:lv}}
 throw new Error('No matching ayah found in this selection.')}
function show(id){['p1','p2'].forEach(p=>$('#'+p).classList.toggle('hid',p!==id));scrollTo(0,0)}
async function generate(){
 if(!validate())return;show('p2');location.hash='practice';
 ['view','aud','act'].forEach(i=>$('#'+i).classList.add('hid'));$('#e2').innerHTML='';$('#ld').classList.remove('hid');$('#cont').classList.add('hid');$('#rev').textContent='Reveal continuation';
 try{const p=await pick(),s=S.meta.s[p.n-1],a=p.a;S.cur={...p,s};
  $('#rn').textContent=`${s.name} (${s.n}) — Ayah ${a.i}`;
  $('#rm').textContent=`Juz ${a.j} · Ayah no. ${a.g} of 6236 · ${p.level}`;
  $('#ar').innerHTML=toHTML(a.t)||a.u;
  const nx=p.ay.filter(x=>x.i>a.i&&x.i<=a.i+3);
  $('#cont').innerHTML=nx.map(x=>`<div class="ayah">${toHTML(x.t)} ﴿${x.i}﴾</div>`).join('');
  $('#view').classList.remove('hid');$('#aud').classList.remove('hid');$('#act').classList.remove('hid');
  $('#fav').textContent=ls.get('fav',[]).includes(a.g)?'★ Favorited':'☆ Favorite';
  setAudio();addHist(s,a)
 }catch(e){$('#e2').innerHTML=`<div class="err">${e.message}. Check your connection and try again.</div><button class="pri" onclick="generate()">Retry</button>`}
 $('#ld').classList.add('hid')}
const pad=n=>String(n).padStart(3,'0');
function setAudio(){const au=$('#au'),c=S.cur;$('#ae').innerHTML='';S.try=0;playSrc();$('#pp').textContent='Play';$('#sk').value=0;$('#tm').textContent='0:00 / 0:00'}
function playSrc(){const au=$('#au'),c=S.cur,f=$('#rec').value.split('|')[S.try];au.src=`https://everyayah.com/data/${f}/${pad(c.n)}${pad(c.a.i)}.mp3`;au.load()}
const fmt=t=>isFinite(t)?(t/60|0)+':'+String(t%60|0).padStart(2,'0'):'0:00';
function addHist(s,a){let h=ls.get('hist',[]);h.unshift({n:s.n,name:s.name,i:a.i,g:a.g});h=h.slice(0,20);ls.set('hist',h);renderHist()}
function renderHist(){const h=ls.get('hist',[]),mk=ls.get('marks',{}),f=ls.get('fav',[]);$('#hist').innerHTML=h.length?'<ul>'+h.slice(0,6).map(x=>`<li>${x.name} ${x.n}:${x.i} ${f.includes(x.g)?'★':''} ${mk[x.g]?'— '+mk[x.g]:''}</li>`).join('')+'</ul>':'Nothing practiced yet.'}
function init(){
 $('#rec').innerHTML=Object.entries(REC).map(([k,v])=>`<option value="${v}">${k}</option>`).join('');
 $('#legend').innerHTML=Object.keys(TJ).filter(k=>!'sbdc'.includes(k)).map(k=>`<span><i style="background:${TJC[k]}"></i>${TJ[k]}</span>`).join('');
 document.documentElement.dataset.t=ls.get('theme','light');renderHist();
 $('#dm').onclick=()=>{const t=document.documentElement.dataset.t==='dark'?'light':'dark';document.documentElement.dataset.t=t;ls.set('theme',t)};
 document.querySelectorAll('.seg').forEach(g=>g.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(g.id==='mk'){const m=ls.get('marks',{});m[S.cur.a.g]=b.dataset.v;ls.set('marks',m);renderHist();g.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));return}
  g.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));S[g.id]=b.dataset.v;
  if(g.id==='mode'){$('#juzBox').classList.toggle('hid',S.mode!=='juz');$('#surBox').classList.toggle('hid',S.mode!=='surah')}validate()});
 ['from','to'].forEach(i=>$('#'+i).onchange=validate);
 $('#gen').onclick=generate;$('#again').onclick=generate;$('#back').onclick=()=>history.back();
 addEventListener('hashchange',()=>{if(location.hash!=='#practice'){$('#au').pause();show('p1')}});
 $('#lg').onclick=()=>$('#legend').classList.toggle('hid');
 $('#rev').onclick=()=>{const c=$('#cont'),h=c.classList.toggle('hid');$('#rev').textContent=h?'Reveal continuation':'Hide continuation';if(!h&&!c.innerHTML.trim())c.innerHTML='<p class="small">This is the last ayah of the surah.</p>'};
 $('#fav').onclick=()=>{let f=ls.get('fav',[]),g=S.cur.a.g;f=f.includes(g)?f.filter(x=>x!==g):[...f,g];ls.set('fav',f);$('#fav').textContent=f.includes(g)?'★ Favorited':'☆ Favorite';renderHist()};
 $('#fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.().catch(()=>{});
 const au=$('#au');
 $('#rec').onchange=()=>{S.cur&&setAudio();ls.set('rec',$('#rec').value)};$('#rec').value=ls.get('rec',$('#rec').options[0].value);
 $('#pp').onclick=()=>au.paused?au.play().catch(()=>{}):au.pause();
 $('#rp').onclick=()=>{au.currentTime=0;au.play().catch(()=>{})};
 au.onplay=()=>$('#pp').textContent='Pause';au.onpause=()=>$('#pp').textContent='Play';au.onended=()=>$('#pp').textContent='Play';
 au.onwaiting=()=>$('#ae').innerHTML='<span class="small">Loading audio…</span>';au.oncanplay=()=>$('#ae').innerHTML='';
 au.onerror=()=>{if(S.try<$('#rec').value.split('|').length-1){S.try++;return playSrc()}$('#ae').innerHTML='<div class="err">This recording could not be loaded. Try another reciter.</div>'};
 au.ontimeupdate=()=>{$('#tm').textContent=fmt(au.currentTime)+' / '+fmt(au.duration);$('#sk').value=au.duration?au.currentTime/au.duration*100:0};
 $('#sk').oninput=e=>{if(au.duration)au.currentTime=e.target.value/100*au.duration};
 fillSelects();
}
init();
</script></body></html>
