<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>Memorization Practice</title>
<link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;500&family=Amiri+Quran&family=Fraunces:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box}html{background:var(--bg)}body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--art) center bottom/cover no-repeat,var(--wc)}

select{min-width:0;text-overflow:ellipsis;font-size:15px}#surBox .row>div{min-width:0;flex:1 1 0}#diff{display:grid;grid-template-columns:repeat(4,1fr)}#diff button{min-width:0;padding:10px 2px;font-size:14px}

.tjr i{flex:none;display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;background:currentColor}

.rcr{position:relative;display:flex;align-items:center;gap:10px}.ric{flex:none;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--bbd);background:var(--bbg);color:var(--bfg);display:flex;align-items:center;justify-content:center}.rnm{flex:1;min-width:0;line-height:1.25}.rnm small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}.rnm b{font-size:16px}#rec{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0}
.skw{margin-top:12px}.skw input{display:block;margin:0;accent-color:var(--gold)}.tms{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--mute);margin-top:2px}.ctl{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:8px}#rp{width:38px;height:38px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center}#pp{width:50px;height:50px;padding:0;border-radius:50%;border:0;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(107,18,32,.28)}
.tjd{margin-top:8px;padding:10px 8px 4px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.45;color:var(--mute)}.tjd b{color:var(--ink)}
.h{color:#b0b0b0}.s{color:#787878}.l{color:#8e2b4c}.n{color:#1f5fd8}.p{color:#4aa3f0}.m{color:#d62828}.o{color:#e8590c}.q{color:#e0457b}.f{color:#6a3fd0}.c{color:#b02fc4}.w{color:#2b9348}.i{color:#0aa5c0}.a{color:#6a9a0b}.u{color:#0a9a7a}.g{color:#c99700}.d{color:#9a5b2e}.b{color:#5b7083}
:root[data-t=dark] .h{color:#7e7e7e}:root[data-t=dark] .s{color:#aaaaaa}:root[data-t=dark] .l{color:#e0708f}:root[data-t=dark] .n{color:#7d93ff}:root[data-t=dark] .p{color:#6fb4ff}:root[data-t=dark] .m{color:#ff5c5c}:root[data-t=dark] .o{color:#ff9f45}:root[data-t=dark] .q{color:#ff7fae}:root[data-t=dark] .f{color:#a98bff}:root[data-t=dark] .c{color:#e07cf0}:root[data-t=dark] .w{color:#5fd17a}:root[data-t=dark] .i{color:#4fd8f0}:root[data-t=dark] .a{color:#a4d63f}:root[data-t=dark] .u{color:#3ad6b0}:root[data-t=dark] .g{color:#f2c230}:root[data-t=dark] .d{color:#d29a6a}:root[data-t=dark] .b{color:#94aab9}
.cont .ayah{font-size:clamp(24px,6vw,34px)}.small{font-size:13px;color:var(--mute)}
ul{padding-left:18px;margin:6px 0}
:fullscreen{overflow:auto;background:var(--bg)}
</style></head><body><main>
<div class="top"><h1>Memorization Practice</h1><div class="row" style="flex:none"><button class="ghost" id="dm" title="Dark mode">◐</button></div></div>

<section id="p1">
  <div class="card">
  <label>Practice by</label>
  <div class="seg" id="mode"><button data-v="juz" class="on">Juz</button><button data-v="surah">Surah range</button></div>
  <div id="juzBox"><label for="juz">Juz</label><select id="juz"></select></div>
  <div id="surBox" class="hid"><div class="row"><div><label for="from">From Surah</label><select id="from"></select></div><div><label for="to">To Surah</label><select id="to"></select></div></div></div>
  <label>Difficulty</label>
  <div class="seg" id="diff"><button data-v="easy">Easy</button><button data-v="moderate" class="on">Moderate</button><button data-v="hard">Hard</button><button data-v="mix">Mix</button></div>
  <div id="e1"></div>
  <button class="pri" id="gen">Start Practice</button>
 </div>
 <div class="card"><b>Recent</b><div id="hist" class="small">Nothing practiced yet.</div></div>
</section>

<section id="p2" class="hid">
 <div class="row top2"><button class="ghost" id="back" aria-label="Back"><svg width="12" height="20" viewBox="0 0 12 20" aria-hidden="true"><path d="M10 2 2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
 <div class="tjw hid" id="tjw"><button class="tjb" id="tjb"><span>Tajweed colors</span><span id="tjar">▾</span></button><div class="tjp hid" id="tjp"></div></div>
 <div class="card">
  <div id="e2"></div><div id="ld" class="load hid">Loading ayah…</div>
  <div id="view" class="hid">
   <div class="vbar"><button class="ghost hid" id="fav">☆ Favorite</button></div>
   <div class="ref"><b id="rn"></b><div id="rm"></div></div>
   <div class="ayah" id="ar"></div>
  </div>
 </div>
 <div class="card hid" id="aud">
  <div class="rcr"><div class="ric"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14v-2a9 9 0 0 1 18 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg></div><div class="rnm"><small>Reciter</small><b id="rn2"></b></div><div class="ric"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 10l4-4 4 4M8 14l4 4 4-4"/></svg></div><select id="rec" aria-label="Change reciter"></select></div>
  <audio id="au" preload="none"></audio>
  <div class="skw"><input type="range" id="sk" min="0" max="100" value="0" aria-label="Progress"><div class="tms"><span id="t1">0:00</span><span id="t2">0:00</span></div></div>
  <div class="ctl"><button id="rp" aria-label="Replay"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button><button id="pp" aria-label="Play"></button></div>
  <div id="ae"></div>
 </div>
 <div class="card hid" id="act">
  <button class="pri" style="margin-top:0" id="rev">Reveal continuation</button>
  <div id="cont" class="cont hid"></div>
  <label>How did it go?</label>
  <div class="seg" id="mk"><button data-v="Knew it">I knew it</button><button data-v="Struggled">I struggled</button><button data-v="Review">Need review</button></div>
  <button class="pri" id="again">Another ayah</button>
 </div>
</section>
<p class="small" style="text-align:center">Hotfix 0.2.1</p></main>
<script>
const API='https://api.alquran.cloud/v1/',$=s=>document.querySelector(s);
const REC={'Yasser Al-Dosari':'Yasser_Ad-Dussary_128kbps|Dussary_128kbps','Mishary Alafasy':'Alafasy_128kbps','Abdul Rahman Al-Sudais':'Abdurrahmaan_As-Sudais_192kbps','Abdul Basit (Murattal)':'Abdul_Basit_Murattal_192kbps','Al-Husary':'Husary_128kbps','Maher Al-Muaiqly':'MaherAlMuaiqly128kbps'};
const S={mode:'juz',diff:'moderate',meta:null,cur:null};
const NM=["Al-Fatihah", "Al-Baqarah", "Ali 'Imran", "An-Nisa", "Al-Ma'idah", "Al-An'am", "Al-A'raf", "Al-Anfal", "At-Tawbah", "Yunus", "Hud", "Yusuf", "Ar-Ra'd", "Ibrahim", "Al-Hijr", "An-Nahl", "Al-Isra", "Al-Kahf", "Maryam", "Ta-Ha", "Al-Anbya", "Al-Hajj", "Al-Mu'minun", "An-Nur", "Al-Furqan", "Ash-Shu'ara", "An-Naml", "Al-Qasas", "Al-'Ankabut", "Ar-Rum", "Luqman", "As-Sajdah", "Al-Ahzab", "Saba", "Fatir", "Ya-Sin", "As-Saffat", "Sad", "Az-Zumar", "Ghafir", "Fussilat", "Ash-Shuraa", "Az-Zukhruf", "Ad-Dukhan", "Al-Jathiyah", "Al-Ahqaf", "Muhammad", "Al-Fath", "Al-Hujurat", "Qaf", "Adh-Dhariyat", "At-Tur", "An-Najm", "Al-Qamar", "Ar-Rahman", "Al-Waqi'ah", "Al-Hadid", "Al-Mujadila", "Al-Hashr", "Al-Mumtahanah", "As-Saf", "Al-Jumu'ah", "Al-Munafiqun", "At-Taghabun", "At-Talaq", "At-Tahrim", "Al-Mulk", "Al-Qalam", "Al-Haqqah", "Al-Ma'arij", "Nuh", "Al-Jinn", "Al-Muzzammil", "Al-Muddaththir", "Al-Qiyamah", "Al-Insan", "Al-Mursalat", "An-Naba", "An-Nazi'at", "'Abasa", "At-Takwir", "Al-Infitar", "Al-Mutaffifin", "Al-Inshiqaq", "Al-Buruj", "At-Tariq", "Al-A'la", "Al-Ghashiyah", "Al-Fajr", "Al-Balad", "Ash-Shams", "Al-Layl", "Ad-Duha", "Ash-Sharh", "At-Tin", "Al-'Alaq", "Al-Qadr", "Al-Bayyinah", "Az-Zalzalah", "Al-'Adiyat", "Al-Qari'ah", "At-Takathur", "Al-'Asr", "Al-Humazah", "Al-Fil", "Quraysh", "Al-Ma'un", "Al-Kawthar", "Al-Kafirun", "An-Nasr", "Al-Masad", "Al-Ikhlas", "Al-Falaq", "An-Nas"],CT=[7, 286, 200, 176, 120, 165, 206, 75, 129, 109, 123, 111, 43, 52, 99, 128, 111, 110, 98, 135, 112, 78, 118, 64, 77, 227, 93, 88, 69, 60, 34, 30, 73, 54, 45, 83, 182, 88, 75, 85, 54, 53, 89, 59, 37, 35, 38, 29, 18, 45, 60, 49, 62, 55, 78, 96, 29, 22, 24, 13, 14, 11, 11, 18, 12, 12, 30, 52, 52, 44, 28, 28, 20, 56, 40, 31, 50, 40, 46, 42, 29, 19, 36, 25, 22, 17, 19, 26, 30, 20, 15, 21, 11, 8, 8, 19, 5, 8, 8, 11, 11, 8, 3, 9, 5, 4, 7, 3, 6, 3, 5, 4, 5, 6],JS=[1, 2, 2, 3, 4, 4, 5, 6, 7, 8, 9, 11, 12, 15, 17, 18, 21, 23, 25, 27, 29, 33, 36, 39, 41, 46, 51, 58, 67, 78];
S.meta={s:NM.map((name,i)=>({n:i+1,name,c:CT[i]})),j:JS.map(x=>({s:x}))};
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function jget(u){for(let t=0;t<3;t++){try{const r=await fetch(API+u);if(!r.ok)throw 0;const j=await r.json();if(j.code===200)return j.data}catch{}await sleep(500*(t+1))}throw new Error('Network request failed')}
const plain=t=>t.replace(/\[[a-z](?::\d+)?\[([^\]]*)\]/g,'$1');
const words=t=>plain(t).trim().split(/\s+/).length;
function toHTML(t){
 const M='[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u08D3-\u08FF]',IM=new RegExp('^'+M+'$'),K=new RegExp(M,'g'),re=/\[([a-z])(?::\d+)?\[([^\]]*)\]/g,NJ=/[اأإآٱءؤدذرزوة]/,L=/[\u0621-\u064A\u0671]/;
 // 1) tag every character with its tajweed class
 const ch=[];let i=0,m;const push=(s,c)=>{for(const x of s)ch.push({x,c})};
 while(m=re.exec(t)){push(t.slice(i,m.index),'');push(m[2],m[1]);i=re.lastIndex}
 push(t.slice(i),'');
 // 2) group into letters (base + all its marks); the whole letter gets one colour
 const cl=[];
 for(const o of ch){
  if(IM.test(o.x)&&cl.length){const k=cl[cl.length-1];k.x+=o.x;if(!k.c)k.c=o.c}
  else cl.push({x:o.x,c:o.c})}
 // 3) merge neighbours that share a colour
 const seg=[];
 for(const k of cl){const q=seg[seg.length-1];if(q&&q.c===k.c)q.x+=k.x;else seg.push({c:k.c,x:k.x})}
 // 4) keep letters joined across colour changes
 const last=z=>{const b=z.replace(K,'');return b[b.length-1]||''},first=z=>{const b=z.replace(K,'');return b[0]||''};
 for(let k=1;k<seg.length;k++){const a=seg[k-1],b=seg[k];if(!a.c&&!b.c)continue;const p=last(a.x),f=first(b.x);if(L.test(p)&&L.test(f)&&!NJ.test(p)&&f!=='ء'){a.x+='\u200D';b.x='\u200D'+b.x}}
 return seg.map(z=>z.c?`<span class="${z.c}">${z.x}</span>`:z.x).join('').replace(/(\s?[\u06D6-\u06DC]+)/g,'<span class="wq">$1</span>')}
// Load surah (cached): uthmani + tajweed
async function surah(n){
 const k='sur'+n;let c=ls.get(k);if(c)return c;
 const d=await jget(`surah/${n}/editions/quran-uthmani,quran-tajweed`);
 const [u,t]=d;c=u.ayahs.map((a,i)=>{let tx=a.text,tj=t.ayahs[i].text;
  if(a.numberInSurah===1&&n!==1&&n!==9){tx=tx.split(' ').slice(4).join(' ');tj=tj.split(' ').slice(4).join(' ')}
  return{g:a.number,i:a.numberInSurah,j:a.juz,u:tx,t:tj}});
 if(!ls.set(k,c)){try{Object.keys(localStorage).filter(x=>x.startsWith('sur')&&x!==k).forEach(x=>localStorage.removeItem(x))}catch{}ls.set(k,c)}
 return c}
function fillSelects(){const m=S.meta,o=m.s.map(s=>`<option value="${s.n}">${s.n}. ${s.name}</option>`).join('');
 $('#from').innerHTML=o;$('#to').innerHTML=o;$('#to').value=114;
 $('#juz').innerHTML=Array.from({length:30},(_,i)=>`<option value="${i+1}">Juz ${i+1}</option>`).join('')}
function juzSurahs(j){const m=S.meta,a=m.j[j-1].s,b=j<30?m.j[j].s:114;return Array.from({length:b-a+1},(_,i)=>a+i)}
function validate(){if(S.mode==='surah'&&+$('#from').value>+$('#to').value){$('#e1').innerHTML='<div class="err">“From” surah must come before or equal “To”.</div>';return false}$('#e1').innerHTML='';return true}
async function mapLimit(a,n,f){const o=Array(a.length);let i=0;await Promise.all(Array.from({length:Math.min(n,a.length)},async()=>{while(i<a.length){const k=i++;o[k]=await f(a[k])}}));return o}
async function buildPool(){
 const jz=+$('#juz').value,f=+$('#from').value,t=+$('#to').value;
 let list=S.mode==='juz'?juzSurahs(jz):Array.from({length:t-f+1},(_,i)=>f+i);
 if(S.mode!=='juz'&&list.length>30){list=list.map(n=>[Math.random(),n]).sort((a,b)=>a[0]-b[0]).slice(0,30).map(x=>x[1])}
 const all=await mapLimit(list,4,async n=>[n,await surah(n)]);
 const items=[];
 all.forEach(([n,ay])=>ay.forEach(a=>{if((S.mode==='surah'||a.j===jz))items.push({n,ay,a,w:words(a.u)})}));
 if(!items.length)throw new Error('No ayah found in this selection');
 const ws=items.map(x=>x.w).sort((x,y)=>x-y);
 S.pool={items,lo:ws[ws.length/3|0],hi:ws[ws.length*2/3|0],seen:new Set()}}
function pickFrom(d){
 const P=S.pool,b=w=>w<=P.lo?'easy':w<=P.hi?'moderate':'hard';
 const lv=d==='mix'?['easy','moderate','hard'][Math.random()*3|0]:d;
 let all=P.items.filter(x=>b(x.w)===lv);if(!all.length)all=P.items;
 let c=all.filter(x=>!P.seen.has(x.a.g));
 if(!c.length){all.forEach(x=>P.seen.delete(x.a.g));c=all}
 const x=c[Math.random()*c.length|0];
 P.seen.add(x.a.g);return{n:x.n,ay:x.ay,a:x.a,level:lv}}
const toAr=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
function art(dk){const g=dk?'#d9a95a':'#d4b06a',m=dk?'#4a2028':'#e2d6c3';let l='';
 for(let i=0;i<20;i++){const a=i*Math.PI/10,r=i%2?30:44;l+=`<line x1="${(320+12*Math.cos(a)).toFixed(1)}" y1="${(90+12*Math.sin(a)).toFixed(1)}" x2="${(320+r*Math.cos(a)).toFixed(1)}" y2="${(90+r*Math.sin(a)).toFixed(1)}"/>`}
 const sp=[[60,300],[120,420],[250,360],[340,520],[30,560],[300,240],[80,150]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2.2"/>`).join('');
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800"><g stroke="${g}" stroke-width="1.6" stroke-linecap="round" opacity=".8">${l}</g><g fill="${g}" opacity=".6">${sp}</g><g fill="${m}" opacity="${dk?.7:.85}"><path d="M120 800V705C120 650 160 622 185 600C210 622 250 650 250 705V800Z"/><rect x="184" y="575" width="2" height="26"/><path d="M60 800V748C60 724 78 710 92 700C106 710 124 724 124 748V800Z"/><path d="M246 800V748C246 724 264 710 278 700C292 710 310 724 310 748V800Z"/><rect x="30" y="690" width="7" height="110"/><rect x="332" y="690" width="7" height="110"/></g></svg>`}
function applyArt(){document.documentElement.style.setProperty('--art',`url("data:image/svg+xml,${encodeURIComponent(art(document.documentElement.dataset.t==='dark'))}")`)}
function clearHash(){try{if(location.hash)history.replaceState(null,'',location.pathname+location.search)}catch{}}
function goHome(){$('#au').pause();show('p1');clearHash()}
function show(id){['p1','p2'].forEach(p=>$('#'+p).classList.toggle('hid',p!==id));scrollTo(0,0)}
async function generate(){
 if(!validate())return;show('p2');location.hash='practice';
 ['view','aud','act','fav','tjw'].forEach(i=>$('#'+i).classList.add('hid'));$('#e2').innerHTML='';$('#mk').querySelectorAll('button').forEach(x=>x.classList.remove('on'));$('#ld').classList.remove('hid');$('#cont').classList.add('hid');$('#rev').textContent='Reveal continuation';
 try{if(!S.pool)await buildPool();const p=pickFrom(S.diff),s=S.meta.s[p.n-1],a=p.a;S.cur={...p,s};
  $('#rn').textContent=`${s.name} (${s.n}) — Ayah ${a.i}`;
  $('#rm').textContent=`Juz ${a.j} · ${p.level}`;
  $('#ar').innerHTML=toHTML(a.t)||a.u;
  const nx=p.ay.filter(x=>x.i>a.i&&x.i<=a.i+3);
  $('#cont').innerHTML=nx.map(x=>`<div class="ayah">${toHTML(x.t)} <span class="end">۝${toAr(x.i)}</span></div>`).join('');
  $('#view').classList.remove('hid');$('#aud').classList.remove('hid');$('#act').classList.remove('hid');
  favUI(ls.get('fav',[]).includes(a.g));$('#fav').classList.remove('hid');
  const mv=ls.get('marks',{})[a.g];$('#mk').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.v===mv));
  renderLeg();setAudio();addHist(s,a)
 }catch(e){$('#e2').innerHTML=`<div class="err">${e.message}. Check your connection and try again.</div><button class="pri" onclick="generate()">Retry</button>`}
 $('#ld').classList.add('hid')}
function favUI(on){const b=$('#fav');b.innerHTML=`<span class="st">${on?'★':'☆'}</span> Favorite`;b.classList.toggle('fav-on',on)}
const TJN={n:'Madd natural (2)',p:'Madd permissible (2–6)',m:'Madd necessary (6)',o:'Madd obligatory (4–5)',q:'Qalqalah',f:'Ikhfa',c:'Ikhfa shafawi',w:'Idgham shafawi',a:'Idgham with ghunnah',u:'Idgham without ghunnah',i:'Iqlab',g:'Ghunnah',d:'Idgham mutajanisayn',b:'Idgham mutaqaribayn',h:'Hamzat wasl',l:'Lam shamsiyya',s:'Silent letter'};
const TJD={n:'A natural long vowel, held for 2 counts.',p:'A long vowel that may be held for 2, 4 or 6 counts, for example before a pause or when it meets a hamza in the next word.',m:'A required prolongation of 6 counts, when a madd letter is followed by a sukun or shadda in the same word.',o:'A mandatory prolongation of 4 to 5 counts, when a madd letter is followed by a hamza in the same word.',q:'A slight echo or bounce on the letters ق ط ب ج د when they carry a sukun.',f:'Hiding: noon sakinah or tanween is pronounced with a nasal sound, between clear and merged, before 15 letters.',c:'Hiding of meem sakinah with a nasal sound when it is followed by ب.',w:'Merging of meem sakinah into a following meem, with a nasal sound held for 2 counts.',a:'Noon sakinah or tanween merges into ي ن م or و, with a nasal sound.',u:'Noon sakinah or tanween merges completely into ل or ر, with no nasal sound.',i:'Noon sakinah or tanween turns into a meem sound, with a nasal sound, before ب.',g:'A nasal sound held for 2 counts on a noon or meem with shadda.',d:'Merging of two letters that share the same point of articulation but differ in characteristics.',b:'Merging of two letters whose points of articulation are close or whose characteristics are similar.',h:'The connecting alif: pronounced when you start with it, silent when joined to the word before it.',l:'The lam of ال is not pronounced, and the letter after it is doubled.',s:'A letter that is written but not pronounced.'};
function renderLeg(){const seen=[];document.querySelectorAll('#ar span[class]:not(.wq)').forEach(e=>{const c=e.className;if(TJN[c]&&!seen.includes(c))seen.push(c)});
 $('#tjp').innerHTML=`<div class="tjg">${seen.map(c=>`<button class="tjr ${c}" data-c="${c}">${TJN[c]}</button>`).join('')}</div><div class="tjd hid" id="tjdef"></div>`;
 $('#tjp').classList.add('hid');$('#tjar').textContent='▾';$('#tjw').classList.toggle('hid',!seen.length)}
const pad=n=>String(n).padStart(3,'0');
const IPL='<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>',IPA='<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>';
function ppUI(p){const b=$('#pp');b.innerHTML=p?IPA:IPL;b.setAttribute('aria-label',p?'Pause':'Play')}
function recName(){$('#rn2').textContent=$('#rec').selectedOptions[0].textContent}
function setAudio(){$('#ae').innerHTML='';S.try=0;playSrc();ppUI(0);$('#sk').value=0;$('#t1').textContent=$('#t2').textContent='0:00'}
function playSrc(){const au=$('#au'),c=S.cur,f=$('#rec').value.split('|')[S.try];au.src=`https://everyayah.com/data/${f}/${pad(c.n)}${pad(c.a.i)}.mp3`;au.load()}
const fmt=t=>isFinite(t)?(t/60|0)+':'+String(t%60|0).padStart(2,'0'):'0:00';
function addHist(s,a){let h=ls.get('hist',[]);h.unshift({n:s.n,name:s.name,i:a.i,g:a.g});h=h.slice(0,20);ls.set('hist',h);renderHist()}
function renderHist(){const h=ls.get('hist',[]),mk=ls.get('marks',{}),f=ls.get('fav',[]);$('#hist').innerHTML=h.length?'<ul>'+h.slice(0,6).map(x=>`<li>${x.name} ${x.n}:${x.i} ${f.includes(x.g)?'★':''} ${mk[x.g]?'— '+mk[x.g]:''}</li>`).join('')+'</ul>':'Nothing practiced yet.'}
function init(){
 $('#rec').innerHTML=Object.entries(REC).map(([k,v])=>`<option value="${v}">${k}</option>`).join('');
 document.documentElement.dataset.t=ls.get('theme','light');renderHist();applyArt();$('#e2').parentElement.classList.add('page');
 $('#dm').onclick=()=>{const t=document.documentElement.dataset.t==='dark'?'light':'dark';document.documentElement.dataset.t=t;ls.set('theme',t);applyArt()};
 document.querySelectorAll('.seg').forEach(g=>g.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(g.id==='mk'){const m=ls.get('marks',{});m[S.cur.a.g]=b.dataset.v;ls.set('marks',m);renderHist();g.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));return}
  g.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));S[g.id]=b.dataset.v;
  if(g.id==='mode'){$('#juzBox').classList.toggle('hid',S.mode!=='juz');$('#surBox').classList.toggle('hid',S.mode!=='surah')}validate()});
 $('#from').onchange=()=>{if(+$('#from').value>+$('#to').value)$('#to').value=$('#from').value;validate()};$('#to').onchange=()=>{if(+$('#to').value<+$('#from').value)$('#from').value=$('#to').value;validate()};
 $('#gen').onclick=()=>{S.pool=null;generate()};$('#again').onclick=generate;$('#back').onclick=goHome;
 $('#tjb').onclick=()=>{const h=$('#tjp').classList.toggle('hid');$('#tjar').textContent=h?'▾':'▴'};
 $('#tjp').onclick=e=>{const b=e.target.closest('.tjr');if(!b)return;const c=b.dataset.c,d=$('#tjdef'),same=b.classList.contains('sel');$('#tjp').querySelectorAll('.tjr').forEach(x=>x.classList.remove('sel'));if(same){d.classList.add('hid');return}b.classList.add('sel');d.innerHTML=`<b>${TJN[c]}</b><br>${TJD[c]}`;d.classList.remove('hid')};
 let sx=null,sy=0;
 addEventListener('touchstart',e=>{const t=e.touches[0];sx=(t.clientX<=30&&!$('#p2').classList.contains('hid'))?t.clientX:null;sy=t.clientY},{passive:true});
 addEventListener('touchend',e=>{if(sx===null)return;const t=e.changedTouches[0];if(t.clientX-sx>70&&Math.abs(t.clientY-sy)<60)goHome();sx=null},{passive:true});
 addEventListener('hashchange',()=>{if(location.hash==='#practice'){if(S.cur&&$('#p2').classList.contains('hid'))show('p2')}else goHome()});
 clearHash();
 $('#rev').onclick=()=>{const c=$('#cont'),h=c.classList.toggle('hid');$('#rev').textContent=h?'Reveal continuation':'Hide continuation';if(!h&&!c.innerHTML.trim())c.innerHTML='<p class="small">This is the last ayah of the surah.</p>'};
 $('#fav').onclick=()=>{let f=ls.get('fav',[]),g=S.cur.a.g;f=f.includes(g)?f.filter(x=>x!==g):[...f,g];ls.set('fav',f);favUI(f.includes(g));renderHist()};
 const au=$('#au');
 $('#rec').onchange=()=>{recName();S.cur&&setAudio();ls.set('rec',$('#rec').value)};$('#rec').value=ls.get('rec',$('#rec').options[0].value);recName();ppUI(0);
 $('#pp').onclick=()=>au.paused?au.play().catch(()=>{}):au.pause();
 $('#rp').onclick=()=>{au.currentTime=0;au.play().catch(()=>{})};
 au.onplay=()=>ppUI(1);au.onpause=()=>ppUI(0);au.onended=()=>ppUI(0);
 au.onwaiting=()=>$('#ae').innerHTML='<span class="small">Loading audio…</span>';au.oncanplay=()=>$('#ae').innerHTML='';
 au.onerror=()=>{if(S.try<$('#rec').value.split('|').length-1){S.try++;return playSrc()}$('#ae').innerHTML='<div class="err">This recording could not be loaded. Try another reciter.</div>'};
 au.ontimeupdate=()=>{$('#t1').textContent=fmt(au.currentTime);$('#t2').textContent=fmt(au.duration);$('#sk').value=au.duration?au.currentTime/au.duration*100:0};
 $('#sk').oninput=e=>{if(au.duration)au.currentTime=e.target.value/100*au.duration};
 fillSelects();
}
init();
</script></body></html>
